name: Release

on:
  push:
    branches: [main]

# Reset permissions at the workflow level; each job grants only what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  # Pending changesets exist: open/update the "Version Packages" PR. No registry access,
  # no approval gate — this only ever bumps versions/changelogs and opens a PR.
  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install --frozen-lockfile
      - uses: changesets/action/version@v2.1.2
        with:
          script: bun run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  # The Version Packages PR was just merged: build and pack the packages whose versions
  # changed. No npm/registry access in this job.
  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - id: pack
        uses: changesets/action/pack@v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # The actual npm publish. Gated behind the "npm-publish" GitHub Actions environment,
  # which requires a maintainer's manual approval before this job runs (see PUBLISHING.md).
  # Authenticates via npm trusted publishing (OIDC) — id-token: write, no stored secret.
  publish:
    needs: [select-mode, pack]
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # setup-node's bundled npm doesn't meet trusted publishing's >= 11.5.1 floor
      # (Node 22's bundled npm is 10.x) — without this, publish runs unauthenticated
      # and npm returns a generic 404 instead of a clear auth error.
      - run: npm install -g npm@12.0.2
      - uses: changesets/action/publish@v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
